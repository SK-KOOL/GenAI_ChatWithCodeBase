<div style="padding:20px">

  <h2>Codebase Chat Tool</h2>

  <input
    [(ngModel)]="repoUrl"
    placeholder="Git Repository URL"
    style="width:400px"
  />

  <button (click)="cloneRepository()">
    Clone Repository
  </button>

  <br /><br />

  <input
    [(ngModel)]="question"
    placeholder="Ask anything about repository"
    style="width:400px"
  />

  <button (click)="askCodebase()">
    Ask
  </button>

  @if(!isRecording){
    <button (click)="startRecording()">
      Start Recording Question
    </button>
  }
  @if(isRecording){
    <button (click)="stopRecording('codebase')">
      Search Codebase
    </button>
  }

  <p>{{ answer }}</p>

  <hr />

  <h2>Natural Language to SQL Tool</h2>

  <input
    [(ngModel)]="dbQuestion"
    placeholder="Ask database question"
    style="width:400px"
  />

  <button (click)="askDatabase()">
    Execute
  </button>

  @if(!isRecording){
    <button (click)="startRecording()">
      Start Recording Question
    </button>
  }
  @if(isRecording){
    <button (click)="stopRecording('database')">
      Search Database
    </button>
  }
  <pre>{{ dbResponse | json }}</pre>

  <hr />

  <app-voice-chat></app-voice-chat>

</div>
